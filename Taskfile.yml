# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'
tasks:
  default:
    desc: Run Molecule tests for default scenario
    cmd: molecule test
  postgres:
    desc: Run Molecule tests for postgres scenario
    cmd: molecule test -s postgres
  sidekiq:
    desc: Run Molecule tests for sidekiq scenario
    cmd: molecule test -s sidekiq
  all:
    desc: Run Molecule tests for all scenarios (sequential)
    cmds:
      - task: default
      - task: postgres
      - task: sidekiq
