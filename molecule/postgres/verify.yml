---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    ## 前処理：各種ファクト取得
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto
    - name: Gather service facts
      ansible.builtin.service_facts:
    - name: Gather listen ports facts
      community.general.listen_ports_facts:
        command: ss
    ## ユーザーとグループのテスト
    - name: Check user redmine exists
      ansible.builtin.getent:
        database: passwd
        key: redmine
    - name: Assert user redmine exists
      ansible.builtin.assert:
        that:
          - ansible_facts["getent_passwd"]["redmine"] is defined
        fail_msg: "redmine user does not exist"
        success_msg: "redmine user exists"
    - name: Check group redmine exists
      ansible.builtin.getent:
        database: group
        key: redmine
    - name: Assert group redmine exists
      ansible.builtin.assert:
        that:
          - ansible_facts["getent_group"]["redmine"] is defined
        fail_msg: "redmine group does not exist"
        success_msg: "redmine group exists"
    ## パッケージのテスト
    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - ansible_facts.packages['ruby'] is defined
          - ansible_facts.packages['ruby-dev'] is defined
          - ansible_facts.packages['rubygems-integration'] is defined
          - ansible_facts.packages['acl'] is defined
          - ansible_facts.packages['git'] is defined
        fail_msg: "Required packages are missing"
        success_msg: "Required packages are installed"
    ## サービスのテスト
    - name: Assert Redmine service
      ansible.builtin.assert:
        that:
          - ansible_facts.services['redmine.service'] is defined
          - ansible_facts.services['redmine.service']['state'] == 'running'
          - ansible_facts.services['redmine.service']['status'] == 'enabled'
        fail_msg: "redmine.service is not running or not enabled"
        success_msg: "redmine.service is running and enabled"
    ## 待受ポートのテスト
    - name: Assert listen port 3000
      ansible.builtin.assert:
        that:
          - 3000 in (ansible_facts.tcp_listen | map(attribute='port') | unique | list)
        fail_msg: "Port 3000 is not listening"
        success_msg: "Port 3000 is listening"
    ## PostgreSQL接続テスト
    - name: Test PostgreSQL connection
      block:
        - name: Check PostgreSQL port 5432 is listening
          ansible.builtin.assert:
            that:
              - 5432 in (ansible_facts.tcp_listen | map(attribute='port') | unique | list)
            fail_msg: "PostgreSQL port 5432 is not listening"
            success_msg: "PostgreSQL port 5432 is listening"
    ## Redmine設定ファイルのテスト
    - name: Test Redmine configuration
      block:
        - name: Check database.yml contains postgresql
          ansible.builtin.slurp:
            src: /opt/redmine/config/database.yml
          register: database_yml_content
        - name: Assert database.yml contains postgresql adapter
          ansible.builtin.assert:
            that:
              - "'postgresql' in database_yml_content.content | b64decode"
            fail_msg: "database.yml does not contain postgresql adapter"
            success_msg: "database.yml contains postgresql adapter"
    ## Redmineディレクトリ構造のテスト
    - name: Test Redmine directory structure
      block:
        - name: Check required directories
          ansible.builtin.stat:
            path: "{{ item }}"
          register: check_directories
          loop:
            - /opt/redmine/plugins
            - /opt/redmine/themes
            - /opt/redmine/public
            - /opt/redmine/tmp
            - /opt/redmine/log
            - /opt/redmine/files
        - name: Assert required directories exist
          ansible.builtin.assert:
            that:
              - check_directories.results[0].stat.isdir
              - check_directories.results[1].stat.isdir
              - check_directories.results[2].stat.isdir
              - check_directories.results[3].stat.isdir
              - check_directories.results[4].stat.isdir
              - check_directories.results[5].stat.isdir
            fail_msg: "Some required directories are missing"
            success_msg: "All required directories exist"
    ## HTTPレスポンステスト
    - name: Test HTTP response
      block:
        - name: Wait for Redmine to be ready
          ansible.builtin.pause:
            seconds: 2
        - name: Check HTTP response
          ansible.builtin.uri:
            url: http://localhost:3000/
            status_code: [200, 302, 403]
          register: http_response
        - name: Assert HTTP response
          ansible.builtin.assert:
            that: http_response.status in [200, 302, 403]
            fail_msg: "HTTP response is not successful"
            success_msg: "HTTP response is successful (status: {{ http_response.status }})"
