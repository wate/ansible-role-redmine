---
- name: Verify
  hosts: all
  gather_facts: false
  become: true
  tasks:
    ## 前処理：各種ファクト取得
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: auto
    - name: Gather service facts
      ansible.builtin.service_facts:
    - name: Gather listen ports facts
      community.general.listen_ports_facts:
        command: ss
    ## ユーザーとグループのテスト
    - name: Check user redmine exists
      ansible.builtin.getent:
        database: passwd
        key: redmine
    - name: Assert user redmine exists
      ansible.builtin.assert:
        that:
          - ansible_facts["getent_passwd"]["redmine"] is defined
        fail_msg: "redmine user does not exist"
        success_msg: "redmine user exists"
    - name: Check group redmine exists
      ansible.builtin.getent:
        database: group
        key: redmine
    - name: Assert group redmine exists
      ansible.builtin.assert:
        that:
          - ansible_facts["getent_group"]["redmine"] is defined
        fail_msg: "redmine group does not exist"
        success_msg: "redmine group exists"
    ## パッケージのテスト
    - name: Assert required packages are installed
      ansible.builtin.assert:
        that:
          - ansible_facts.packages['ruby'] is defined
          - ansible_facts.packages['ruby-dev'] is defined
          - ansible_facts.packages['rubygems-integration'] is defined
          - ansible_facts.packages['acl'] is defined
          - ansible_facts.packages['git'] is defined
        fail_msg: "Required packages are missing"
        success_msg: "Required packages are installed"
    ## テーマのテスト
    - name: Check theme directory
      ansible.builtin.stat:
        path: /opt/redmine/themes
      register: redmine_theme_dir_result
    - name: Test theme
      block:
        - name: Overwrite redmine_theme_dir variable
          ansible.builtin.set_fact:
            redmine_theme_dir: "/opt/redmine/{{ 'themes' if redmine_theme_dir_result.stat.exists else 'public/themes' }}"
        - name: Check installed PurpleMine2 theme
          ansible.builtin.stat:
            path: "{{ redmine_theme_dir }}/PurpleMine2"
          register: check_installed_theme_result
        - name: Assert installed PurpleMine2 theme
          ansible.builtin.assert:
            that: check_installed_theme_result.stat.exists
        - name: Check installed gitmike theme
          ansible.builtin.stat:
            path: "{{ redmine_theme_dir }}/gitmike"
          register: check_installed_theme_result
        - name: Assert installed gitmike theme
          ansible.builtin.assert:
            that: check_installed_theme_result.stat.exists
        - name: Check installed farend_fancy theme
          ansible.builtin.stat:
            path: "{{ redmine_theme_dir }}/farend_fancy"
          register: check_installed_theme_result
        - name: Assert installed farend_fancy theme
          ansible.builtin.assert:
            that: check_installed_theme_result.stat.exists
        - name: Check installed farend_basic theme
          ansible.builtin.stat:
            path: "{{ redmine_theme_dir }}/farend_basic"
          register: check_installed_theme_result
        - name: Assert installed farend_basic theme
          ansible.builtin.assert:
            that: check_installed_theme_result.stat.exists
        - name: Check installed bleuclair theme
          ansible.builtin.stat:
            path: "{{ redmine_theme_dir }}/bleuclair"
          register: check_installed_theme_result
        - name: Assert installed bleuclair theme
          ansible.builtin.assert:
            that: check_installed_theme_result.stat.exists
    - name: Test plugin
      block:
        - name: Check installed view_customize plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/view_customize
          register: check_installed_plugin_result
        - name: Assert installed view_customize plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
        - name: Check installed redmine_issue_templates plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/redmine_issue_templates
          register: check_installed_plugin_result
        - name: Assert installed redmine_issue_templates plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
        - name: Check installed redmine_messenger plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/redmine_messenger
          register: check_installed_plugin_result
        - name: Assert installed redmine_slack plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
        - name: Check installed redmine_dashboard plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/redmine_dashboard
          register: check_installed_plugin_result
        - name: Assert installed redmine_dashboard plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
        - name: Check installed redmine_drawio plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/redmine_drawio
          register: check_installed_plugin_result
        - name: Assert installed redmine_drawio plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
        - name: Check installed redmica_ui_extension plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/redmica_ui_extension
          register: check_installed_plugin_result
        - name: Assert installed redmica_ui_extension plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
        - name: Check installed additionals plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/additionals
          register: check_installed_plugin_result
        - name: Assert installed additionals plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
        - name: Check installed redmine_message_customize plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/redmine_message_customize
          register: check_installed_plugin_result
        - name: Assert installed redmine_message_customize plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
        - name: Check installed redmine_sudo plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/redmine_sudo
          register: check_installed_plugin_result
        - name: Assert installed redmine_sudo plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
        - name: Check installed redmine_dmsf plugin
          ansible.builtin.stat:
            path: /opt/redmine/plugins/redmine_dmsf
          register: check_installed_plugin_result
        - name: Assert installed redmine_dmsf plugin
          ansible.builtin.assert:
            that: check_installed_plugin_result.stat.exists
    - name: Check import task
      ansible.builtin.stat:
        path: /opt/redmine/lib/tasks/import.rake
      register: import_task_result
    - name: Assert import task
      ansible.builtin.assert:
        that: import_task_result.stat.exists
        fail_msg: "Import task does not exist"
        success_msg: "Import task exists"
    ## サービスのテスト
    - name: Assert Redmine service
      ansible.builtin.assert:
        that:
          - ansible_facts.services['redmine.service'] is defined
          - ansible_facts.services['redmine.service']['state'] == 'running'
          - ansible_facts.services['redmine.service']['status'] == 'enabled'
        fail_msg: "redmine.service is not running or not enabled"
        success_msg: "redmine.service is running and enabled"
    ## 待受ポートのテスト
    - name: Assert listen port 3000
      ansible.builtin.assert:
        that:
          - 3000 in (ansible_facts.tcp_listen | map(attribute='port') | unique | list)
        fail_msg: "Port 3000 is not listening"
        success_msg: "Port 3000 is listening"
    ## Redmine設定ファイルのテスト
    - name: Test Redmine configuration
      block:
        - name: Check database.yml exists
          ansible.builtin.stat:
            path: /opt/redmine/config/database.yml
          register: check_database_yml
        - name: Assert database.yml exists
          ansible.builtin.assert:
            that: check_database_yml.stat.exists
            fail_msg: "database.yml does not exist"
            success_msg: "database.yml exists"
        - name: Check configuration.yml exists
          ansible.builtin.stat:
            path: /opt/redmine/config/configuration.yml
          register: check_configuration_yml
        - name: Assert configuration.yml exists
          ansible.builtin.assert:
            that: check_configuration_yml.stat.exists
            fail_msg: "configuration.yml does not exist"
            success_msg: "configuration.yml exists"
        - name: Check environment file exists
          ansible.builtin.stat:
            path: /etc/default/redmine
          register: check_environment_file
        - name: Assert environment file exists
          ansible.builtin.assert:
            that: check_environment_file.stat.exists
            fail_msg: "/etc/default/redmine does not exist"
            success_msg: "/etc/default/redmine exists"
    ## Redmineディレクトリ構造のテスト
    - name: Test Redmine directory structure
      block:
        - name: Check required directories
          ansible.builtin.stat:
            path: "{{ item }}"
          register: check_directories
          loop:
            - /opt/redmine/plugins
            - /opt/redmine/themes
            - /opt/redmine/public
            - /opt/redmine/tmp
            - /opt/redmine/log
            - /opt/redmine/files
        - name: Assert required directories exist
          ansible.builtin.assert:
            that:
              - check_directories.results[0].stat.isdir
              - check_directories.results[1].stat.isdir
              - check_directories.results[2].stat.isdir
              - check_directories.results[3].stat.isdir
              - check_directories.results[4].stat.isdir
              - check_directories.results[5].stat.isdir
            fail_msg: "Some required directories are missing"
            success_msg: "All required directories exist"
    ## Bundlerのテスト
    - name: Test Bundler installation
      block:
        - name: Check vendor/bundle directory exists
          ansible.builtin.stat:
            path: /opt/redmine/vendor/bundle
          register: check_vendor_bundle
        - name: Assert vendor/bundle directory exists
          ansible.builtin.assert:
            that: check_vendor_bundle.stat.isdir
            fail_msg: "vendor/bundle directory does not exist"
            success_msg: "vendor/bundle directory exists"
        - name: Check Gemfile.lock exists
          ansible.builtin.stat:
            path: /opt/redmine/Gemfile.lock
          register: check_gemfile_lock
        - name: Assert Gemfile.lock exists
          ansible.builtin.assert:
            that: check_gemfile_lock.stat.exists
            fail_msg: "Gemfile.lock does not exist"
            success_msg: "Gemfile.lock exists"
    ## Puma設定のテスト
    - name: Test Puma configuration
      block:
        - name: Check puma config exists
          ansible.builtin.stat:
            path: /opt/redmine/config/puma.rb
          register: check_puma_config
        - name: Assert puma config exists
          ansible.builtin.assert:
            that: check_puma_config.stat.exists
            fail_msg: "puma.rb does not exist"
            success_msg: "puma.rb exists"
    ## ログファイルのテスト
    - name: Test log files
      block:
        - name: Check production log exists
          ansible.builtin.stat:
            path: /opt/redmine/log/production.log
          register: check_production_log
        - name: Assert production log exists
          ansible.builtin.assert:
            that: check_production_log.stat.exists
            fail_msg: "production.log does not exist"
            success_msg: "production.log exists"
    ## HTTPレスポンステスト
    - name: Test HTTP response
      block:
        - name: Wait for Redmine to be ready
          ansible.builtin.pause:
            seconds: 2
        - name: Check HTTP response
          ansible.builtin.uri:
            url: http://localhost:3000/
            status_code: [200, 302, 403]
          register: http_response
        - name: Assert HTTP response
          ansible.builtin.assert:
            that: http_response.status in [200, 302, 403]
            fail_msg: "HTTP response is not successful"
            success_msg: "HTTP response is successful (status: {{ http_response.status }})"
    ## import.rake Minitest テスト（production環境 + YAML参照）
    - name: Test import.rake with Minitest
      block:
        - name: Run Minitest tests for import.rake (production)
          ansible.builtin.command:
            cmd: bundle exec ruby test/integration/import_test.rb
            chdir: /opt/redmine
          environment:
            IMPORT_DATA_FILE_NO_DELETE: "1"
            RAILS_ENV: production
          become_user: redmine
          become: true
          register: test_result
          changed_when: false
        - name: Display test results
          ansible.builtin.debug:
            var: test_result.stdout_lines
        - name: Check test status
          ansible.builtin.assert:
            that:
              - test_result.rc == 0
            fail_msg: "Minitest tests failed"
            success_msg: "All Minitest tests passed"
