---
role_name_check: 1
dependency:
  name: galaxy
driver:
  name: vagrant
platforms:
  - name: trixie
    groups:
      - family_debian
    children:
      - debian
    # driver:docker
    image: geerlingguy/docker-debian13-ansible:latest
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    # driver:vagrant
    box: bento/debian-13
    memory: 1024
    cpus: 1
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  options:
    diff: true
  config_options:
    defaults:
      hash_behaviour: merge
      callback_result_format: yaml
    ssh_connection:
      pipelining: true
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
verifier:
  name: ansible
scenario:
  ## cleanupとside_effectはドライバにプレイブックが無いため実行しません
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # - idempotence
    - verify
    - destroy
